<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解説ページ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        img { max-width: 100%; border-radius: 10px; margin-bottom: 20px; }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>

    <!-- 全画面表示 -->
      <link rel="manifest" href="manifest.json">

</head>
<body>
    <h1 id="detail-title">解説</h1>
    <img id="detail-img" src="" alt="">
    <p id="detail-desc">ここに解説文が入ります。</p>

    <!-- 戻るボタン -->
    <a href="index.html" class="back-btn">一覧に戻る</a>

    <script>
        // URLの ?id=XX を取得する
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        // IDごとのデータ（本来はもっと文章を長くできます）
        const data = {
                    "1": { 
                        title: "勝手に追加されたカゴの中身", 
                        mainImage: "images/q1_sneaking.jpg",
                        html: `
                            <p><strong>【判定：正解！ダークパターンです】</strong></p>
                            <p>これは<strong>「こっそり型（Sneaking）」</strong>と呼ばれる手口です。</p>
                            <p>注文を確定する直前に、ユーザーが気づかないように有料オプション（お急ぎ便や寄付など）を最初からチェックが入った状態でカートに追加しています。</p>
                            <p class="advice">対策：注文確定ボタンを押す前に、合計金額の内訳を必ず確認しましょう。</p>
                        `
                    },
                    "2": { 
                        title: "終わらないカウントダウン", 
                        mainImage: "images/q2_urgency.jpg",
                        html: `
                            <p><strong>【判定：正解！ダークパターンです】</strong></p>
                            <p>これは<strong>「緊急型（Urgency）」</strong>と呼ばれる手口です。</p>
                            <p>「セール終了まであと5分！」とカウントダウンを表示して焦らせ、冷静な判断を奪おうとしています。実際にはページを更新すると時間が戻ったり、常にセール中だったりすることがよくあります。</p>
                            <p class="advice">対策：焦らず、一度深呼吸して「本当に今必要か？」と考えましょう。</p>
                        `
                    },
                    "3": { 
                        title: "見えない出口", 
                        mainImage: "images/q3_visual_interference.jpg",
                        html: `
                            <p><strong>【判定：正解！ダークパターンです】</strong></p>
                            <p>これは<strong>「誘導型（Visual Interference）」</strong>と呼ばれる手口です。</p>
                            <p>「有料登録する」などの企業に有利なボタンは大きく鮮やかにし、「断る」などの選択肢は極端に小さく、背景に溶け込むような色にして見つけにくくしています。</p>
                            <p class="advice">対策：目立つボタンだけでなく、画面の隅や薄い文字のリンクを探す癖をつけましょう。</p>
                        `
                    },
                    "4": { 
                        title: "サクラの行列", 
                        mainImage: "images/q4_social_proof.jpg",
                        html: `
                            <p><strong>【判定：正解！ダークパターンです】</strong></p>
                            <p>これは<strong>「社会的証明型（Social Proof）」</strong>の悪用です。</p>
                            <p>「たった今、〇〇さんが予約しました」という通知を出し、「みんな買っているから安心だ」と思わせようとしています。これはプログラムでランダムに表示された嘘の情報の可能性があります。</p>
                            <p class="advice">対策：他人の行動に惑わされず、自分にとっての価値で判断しましょう。</p>
                        `
                    },
                    "5": { 
                        title: "煽られる在庫切れ", 
                        mainImage: "images/q5_scarcity.jpg",
                        html: `
                            <p><strong>【判定：正解！ダークパターンです】</strong></p>
                            <p>これは<strong>「希少性型（Scarcity）」</strong>と呼ばれる手口です。</p>
                            <p>「残りあと1個！」「15人が検討中」などと表示して、商品を逃す恐怖心を煽り、衝動買いを誘っています。実際には在庫が十分にあるケースも多いです。</p>
                            <p class="advice">対策：在庫情報は操作されている可能性があることを知っておきましょう。</p>
                        `
                    },
                    "6": { 
                        title: "解約させない迷路", 
                        mainImage: "images/q6_obstruction.jpg",
                        html: `
                            <p><strong>【判定：正解！ダークパターンです】</strong></p>
                            <p>これは<strong>「妨害型（Obstruction）」</strong>と呼ばれる手口です。</p>
                            <p>入会はワンクリックで簡単な一方で、退会するには電話しか受け付けていなかったり、複雑な手順を踏ませたりして、あきらめさせようとしています。</p>
                            <p class="advice">対策：契約する前に「解約方法」が簡単かどうかを確認することが重要です。</p>
                        `
                    },
                    "7": { 
                        title: "情報の質草（しちぐさ）", 
                        mainImage: "images/q7_forced_action.jpg",
                        html: `
                            <p><strong>【判定：正解！ダークパターンです】</strong></p>
                            <p>これは<strong>「強制型（Forced Action）」</strong>と呼ばれる手口です。</p>
                            <p>本来見たい情報（価格や詳細）を見る条件として、無関係な会員登録やメルマガへの同意を強制しています。</p>
                            <p class="advice">対策：その情報を見るために、個人情報を渡す価値が本当にあるか考えましょう。</p>
                        `
                    },
                    "8": { 
                        title: "通常の割引表示", 
                        mainImage: "images/q8_safe_discount.jpg",
                        html: `
                            <p><strong>【判定：不正解（これは安全です）】</strong></p>
                            <p>これは通常の<strong>「マーケティング」</strong>です。</p>
                            <p>「20%OFF」のようにお得な情報を目立たせること自体は、嘘をついていなければダークパターンではありません。消費者にメリットがある情報です。</p>
                            <p class="advice">ポイント：全ての赤い文字や強調表示が罠というわけではありません。</p>
                        `
                    },
                    "9": { 
                        title: "必須項目のマーク", 
                        mainImage: "images/q9_safe_required.jpg",
                        html: `
                            <p><strong>【判定：不正解（これは安全です）】</strong></p>
                            <p>これはサービスに必要な<strong>「必須情報」</strong>の確認です。</p>
                            <p>商品を配送するために「住所」や「氏名」が必須なのは当たり前であり、ダークパターン（強制）には当たりません。</p>
                            <p class="advice">ポイント：サービス提供に「関係のない情報（年収など）」まで必須にしている場合は疑いましょう。</p>
                        `
                    },
                    "10": { 
                        title: "おすすめ商品の提案", 
                        mainImage: "images/q10_safe_recommend.jpg",
                        html: `
                            <p><strong>【判定：不正解（これは安全です）】</strong></p>
                            <p>これは<strong>「レコメンド（提案）」</strong>です。</p>
                            <p>「この商品もおすすめ」と表示しているだけで、勝手にカートに入れたり、断れないようにしていなければ問題ありません。ユーザーにとって便利な機能でもあります。</p>
                            <p class="advice">ポイント：自分の意思で「選べる」かどうかが、ダークパターンとの境界線です。</p>
                        `
                    }
        };

        // 画面に表示
        if(id && data[id]) {
            document.getElementById('detail-title').innerText = data[id].title;
            document.getElementById('detail-desc').innerText = data[id].desc;
            document.getElementById('detail-img').src = `images/img${id}.jpg`;
        } else {
            document.getElementById('detail-desc').innerText = "データが見つかりません。";
        }
    </script>
</body>
</html>
